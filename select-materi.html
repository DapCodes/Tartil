<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Pilih materi kuis Tajwid yang ingin kamu pelajari.">
  <title>Pilih Materi Kuis | Tartil</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.1">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
  <div class="select-materi-wrapper page-enter">

    <!-- Top Bar -->
    <div class="explanation-topbar">
      <div class="container">
        <div class="explanation-topbar-row">
          <a href="index.html" class="back-btn" id="backBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
            Kembali
          </a>

        </div>
        <h1>Pilih Materi Kuis</h1>
        <p id="breadcrumb">Pilih bab yang akan diuji (maksimal 20 soal)</p>
      </div>
    </div>

    <!-- Content -->
    <main class="select-materi-content">
      <div class="container">
        <div class="select-actions-top">
          <button id="selectAllBtn" class="action-link">Pilih Semua</button>
          <span class="action-divider">•</span>
          <button id="deselectAllBtn" class="action-link">Batalkan Semua</button>
        </div>
        
        <div class="chapter-grid" id="chapterGrid">
          <!-- Injected via JS -->
        </div>

        <div class="select-materi-footer-actions">
          <button id="startQuizBtn" class="btn btn-primary btn-block btn-start-quiz" disabled>
            Mulai Kuis <span>(0 soal)</span>
          </button>
        </div>
      </div>
    </main>

  </div>

  <script src="data/questions.js?v=1.0.1"></script>
  <script src="js/select-materi.js?v=1.0.1"></script>

</body>
</html>
