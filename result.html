<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Kuis | Tartil</title>
  <meta name="description" content="Lihat hasil kuis tajwid Anda dan pelajari materi yang perlu diperbaiki.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
  <div class="app-wrapper">

    <!-- Result Header Section -->
    <div class="result-header-section">
      <div class="container">
        <div class="result-header-card" id="resultHeaderCard">

          <!-- Emoji -->
          <div class="result-emoji" id="resultEmoji" style="display:none;"></div>
          <!-- Greeting -->
          <h1 class="result-greeting" id="resultGreeting">Luar Biasa!</h1>
          <p class="result-subtitle" id="resultSubtitle">Kamu telah menyelesaikan kuis tajwid</p>

          <!-- Score Ring -->
          <div class="score-ring">
            <svg viewBox="0 0 140 140">
              <circle class="score-ring-bg" cx="70" cy="70" r="65"/>
              <circle class="score-ring-fill" id="scoreRingFill" cx="70" cy="70" r="65"/>
            </svg>
            <div class="score-ring-text">
              <span class="score-num" id="scoreNum">0</span>
              <span class="score-label">dari 15</span>
            </div>
          </div>

          <!-- Stats Row -->
          <div class="result-stats">
            <div class="stat-box correct-stat">
              <span class="stat-num" id="correctCount">0</span>
              <span class="stat-label">Benar</span>
            </div>
            <div class="stat-box wrong-stat">
              <span class="stat-num" id="wrongCount">0</span>
              <span class="stat-label">Salah</span>
            </div>
          </div>

          <!-- Time and Date -->
          <div class="result-meta">
            <div class="result-meta-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
              <span>Waktu: <strong id="totalTime">0:00</strong></span>
            </div>
            <div class="result-meta-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              <span>Tanggal: <strong id="quizDate">-</strong></span>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Review Section -->
    <section class="review-section">
      <div class="container">
        <h2 class="review-title">Pembahasan Jawaban</h2>
        <div class="review-list" id="reviewList">
          <!-- Review cards injected by JS -->
        </div>
      </div>
    </section>

    <!-- Action Buttons -->
    <section class="result-actions-section">
      <div class="container">
        <div class="result-actions-card">
          <a href="#" class="btn btn-primary btn-block" id="retryBtn">
            Ulangi Tes
          </a>
          <a href="index.html" class="btn btn-secondary btn-block" id="homeBtn">
            Kembali ke Beranda
          </a>
          <button class="btn btn-accent btn-block" id="shareBtn">
            Bagikan Hasil
          </button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <p>Tartil © 2024  </p>
      </div>
    </footer>
  </div>

  <script src="data/questions.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
