<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Tartil - Aplikasi Kuis Tajwid Interaktif Bahasa Indonesia">
  <title>Penjelasan Tajwid | Tartil</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.1">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
  <div class="explanation-wrapper page-enter">

    <!-- Top Bar -->
    <div class="explanation-topbar">
      <div class="container">
        <div class="explanation-topbar-row">
          <a href="javascript:void(0)" class="back-btn" id="backBtn" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
            Kembali
          </a>

        </div>
        <h1>Penjelasan Tajwid</h1>
        <p id="breadcrumb"></p>
      </div>
    </div>

    <!-- Topic Navigation -->
    <nav class="explanation-nav" id="topicNav">
      <div class="container" id="topicNavContainer">
        <!-- Buttons injected by JS -->
      </div>
    </nav>

    <!-- Content -->
    <main class="explanation-content">
      <div class="container" id="explanationContent">
        <!-- Content injected by JS -->
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>Tartil © 2024  </p>
      </div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg class="toast-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span class="toast-text" id="toastText"></span>
  </div>

  <script src="data/questions.js?v=1.0.1"></script>
  <script src="js/explanation.js?v=1.0.1"></script>

</body>
</html>
