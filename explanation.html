<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tartil - Aplikasi Kuis Tajwid Interaktif Bahasa Indonesia">
  <title>Penjelasan Tajwid — Tartil</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%231B4332'/%3E%3Cpath d='M30 10C25.5 10 18 13 16 20C14 27 17 36 24 38C17 36 12 28 14 20C16 12 24 8 30 10Z' fill='%23D4AF37'/%3E%3Ccircle cx='28' cy='14' r='2' fill='%23D4AF37'/%3E%3C/svg%3E">
</head>
<body>
  <div class="explanation-wrapper page-enter">

    <!-- Top Bar -->
    <div class="explanation-topbar">
      <div class="container">
        <div class="explanation-topbar-row">
          <a href="javascript:void(0)" class="back-btn" id="backBtn" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
            Kembali
          </a>
          <!-- Dark Mode Toggle -->
          <button class="dark-mode-toggle" id="darkModeToggle" title="Mode Gelap">
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
        </div>
        <h1>Penjelasan Tajwid</h1>
        <p id="breadcrumb">Soal 1 dari 15</p>
      </div>
    </div>

    <!-- Topic Navigation -->
    <nav class="explanation-nav" id="topicNav">
      <div class="container" id="topicNavContainer">
        <!-- Buttons injected by JS -->
      </div>
    </nav>

    <!-- Content -->
    <main class="explanation-content">
      <div class="container" id="explanationContent">
        <!-- Content injected by JS -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>Tartil © 2024 — Belajar Tajwid Setiap Hari <span class="heart">♥</span></p>
      </div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg class="toast-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span class="toast-text" id="toastText"></span>
  </div>

  <script src="data/questions.js"></script>
  <script src="js/explanation.js"></script>
  <script src="js/darkmode.js"></script>
</body>
</html>
